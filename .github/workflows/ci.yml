# Tests und Build bei jedem Pull Request und Push auf main
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Kein Linux-Binary von ow-electron nötig: Tests und Oberflächen-Build laufen ohne Electron
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
