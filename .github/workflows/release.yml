# Beta-Release: baut die App für Windows und macOS Intel und hängt beides an ein GitHub-Release (als Vorabversion markiert).
# Start: Tag v* pushen (z. B. v0.1.0-beta.1) oder von Hand unter Actions → Release.
# Windows ist noch nicht signiert (Code-Signing-Zertifikat kommt später, Anleitung in docs/zertifikat.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      # Ohne Zertifikat und ohne Overwolf-Schlüssel: der Build läuft durch, ow-electron-builder warnt nur.
      # GEP und Overlay laden in so einem Build nicht, die übrige App läuft.
      - run: npx ow-electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer prüfen
        shell: bash
        run: |
          ls -l dist
          n=$(ls dist/*.exe | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then echo "::error::$n Installer gebaut, erwartet 1"; exit 1; fi
          test -f dist/latest.yml || { echo "::error::latest.yml fehlt (Update-Suche unter Windows)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      # Wie im Netzwerkplaner: ad-hoc signiert (identity "-"), kein Apple-Zertifikat, keine Overwolf-Signatur.
      # Auf dem Intel-Runner entsteht ein HFS+-Image; APFS-Images lehnen ältere macOS-Versionen als „beschädigt“ ab.
      - run: npx ow-electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: DMG prüfen
        run: |
          ls -l dist/*.dmg
          n=$(ls dist/*.dmg | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then echo "::error::$n DMGs gebaut, erwartet 1"; exit 1; fi
          hdiutil verify dist/*.dmg
          if ! hdiutil imageinfo dist/*.dmg | grep -q "Apple_HFS"; then echo "::error::Intel-DMG ist kein HFS+-Image"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel
          path: dist/*.dmg

  # Ein Release für beide Builds, erst wenn beide fertig sind
  release:
    needs: [windows, mac-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Advanced LAN ${{ steps.version.outputs.tag }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
          body: |
            Beta von Advanced LAN für Windows und macOS mit Intel-Prozessor.

            **Windows:** `Advanced-LAN-…-win-x64.exe` ausführen. Die App ist noch nicht signiert, deshalb warnt Windows SmartScreen:
            **Weitere Informationen** → **Trotzdem ausführen**. Overwolf-Spiele (GEP) laden erst in einer signierten Version, CS2, Rocket League und Dota 2 gehen schon.

            **macOS:** `.dmg` öffnen und Advanced LAN in den Programme-Ordner ziehen. Beim ersten Start im Finder mit Rechtsklick → **Öffnen** starten
            (oder Systemeinstellungen → Datenschutz & Sicherheit → „Trotzdem öffnen“).

            **Enthalten:** Regie, Game-PC und Standalone in einer App, Sessions per mDNS, OSC-Befehle an Licht, Audio und Video (Ziel-Datenbank, Signale-Matrix),
            CS2 und Dota 2 (Game State Integration), Rocket League (Stats API), Overwolf-Spiele (GEP), Simulator, Mini-Overlay, Game-Stats-Screen (Fenster, NDI).

            Nutzungsbedingungen: https://github.com/Nomisimo/Advanced-Lan/blob/main/docs/TERMS.md · Datenschutz: https://github.com/Nomisimo/Advanced-Lan/blob/main/docs/PRIVACY.md
